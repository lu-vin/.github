# Sitio Astro en Cloudflare Workers: compila y revisa en cada pull request; en main, además publica.
# luvin-architecture: deployment-architecture/0004 (ADR 0002 y 0003).
#
# Lo que el repositorio tiene que traer (template-web ya lo trae):
#   .nvmrc               la versión de Node
#   npm run build        compila a dist/ (y .wrangler/deploy/ si usa el adaptador de Cloudflare)
#   npm run verify       opcional: revisiones propias (tipos, enlaces rotos...)
#   wrangler.jsonc       el Worker que se publica
#   Secreto CLOUDFLARE_API_TOKEN (plantilla "Edit Cloudflare Workers") y CLOUDFLARE_ACCOUNT_ID
#   (secreto o variable).
#
# Uso:
#
#   site:
#     uses: lu-vin/.github/.github/workflows/site.yml@main
#     with:
#       url: https://docs.lu-vin.com
#     secrets: inherit
name: Site

on:
  workflow_call:
    inputs:
      url:
        description: Public URL of the site, shown in the production environment
        type: string
        required: true
      deploy:
        description: Publish on pushes to main (false for template-web itself)
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Compilar
        run: npm run build

      - name: Revisiones del repositorio (npm run verify)
        run: npm run verify --if-present

      # Un solo archivo con dist/ y, si existe, .wrangler/deploy/ (el adaptador de Cloudflare lo genera
      # al compilar y wrangler deploy lo necesita), para que el deploy publique exactamente esto.
      - name: Empaquetar el sitio compilado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.deploy
        run: |
          paths="dist"
          if [ -d .wrangler/deploy ]; then paths="$paths .wrangler/deploy"; fi
          tar -czf site.tgz $paths

      - name: Guardar el sitio compilado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tgz
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ inputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # El id de la cuenta no es secreto: sirve como secreto o como variable.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Recuperar el sitio compilado
        uses: actions/download-artifact@v4
        with:
          name: site

      - run: tar -xzf site.tgz && rm site.tgz

      - name: Revisar la configuración de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing the CLOUDFLARE_API_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::No CLOUDFLARE_ACCOUNT_ID (secret or variable); wrangler will infer the account from the token."
          fi

      - name: Publicar
        run: npx wrangler deploy
